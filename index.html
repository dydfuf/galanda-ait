<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#3182F6" />
    <meta name="application-name" content="갈라고" />
    <meta name="description" content="갈라고 - 친구들과 함께하는 여행 일정 조율" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="갈라고" />
    <script>
      (() => {
        let storedTheme = null;
        try {
          storedTheme = localStorage.getItem("galanda_theme_v1");
        } catch {
          // 저장소 접근이 차단되면 시스템 설정을 사용한다.
        }
        const isDark =
          storedTheme === "dark" ||
          (storedTheme !== "light" &&
            window.matchMedia?.("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", Boolean(isDark));
        document.documentElement.style.colorScheme = isDark ? "dark" : "light";
      })();
    </script>
    <title>갈라고 - 친구들과 함께하는 여행 일정 조율</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
